<!-- menu.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — MURI CHOPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
  <svg class="logo-icon" width="30" height="30" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="24" r="10" fill="#B85C38" />
    <circle cx="32" cy="15" r="13" fill="#B85C38" />
    <circle cx="44" cy="24" r="10" fill="#B85C38" />
    <rect x="16" y="22" width="32" height="14" rx="3" fill="#B85C38" />
    <rect x="14" y="36" width="36" height="20" rx="5" fill="#241C18" />
    <rect x="14" y="36" width="36" height="7" fill="#B85C38" />
  </svg>
  <span class="logo-text">Muri <em>Chops</em></span>
</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="menu.html" class="active">Menu</a>
      </nav>
      <button class="cart-btn" id="cartBtn" aria-label="Open cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
        </svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <section class="menu-hero">
    <h1 class="reveal-up in-view">What are you craving?</h1>
    <div class="search-bar reveal-up in-view">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path>
      </svg>
      <input type="text" id="searchInput" placeholder="Search jollof, suya, zobo...">
    </div>
  </section>

  <div class="category-bar" id="categoryBar">
    <button class="cat-pill active" data-cat="all">All</button>
    <button class="cat-pill" data-cat="rice">Rice & Bowls</button>
    <button class="cat-pill" data-cat="grills">Grills</button>
    <button class="cat-pill" data-cat="small-chops">Small Chops</button>
    <button class="cat-pill" data-cat="drinks">Drinks</button>
  </div>

  <section class="section" style="padding-top:20px;">
    <div class="card-grid" id="menuGrid"></div>
    <p class="empty-cart" id="noResults" style="display:none;">No dishes match your search 🍽️</p>
  </section>

  <!-- Product Detail Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="product-modal" id="productModal">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-img"><img id="modalImg" src="" alt=""></div>
      <div class="modal-body">
        <h2 id="modalName"></h2>
        <p class="desc" id="modalDesc"></p>
        <p class="price" id="modalPrice"></p>

        <div class="extras-block" id="extrasBlock">
          <h4>Add extras</h4>
          <div id="extrasList"></div>
        </div>

        <div class="qty-row">
          <span>Quantity</span>
          <div class="qty-controls">
            <button id="modalQtyMinus">−</button>
            <span id="modalQty">1</span>
            <button id="modalQtyPlus">+</button>
          </div>
        </div>

        <button class="btn btn-primary" id="modalAddBtn" style="width:100%;justify-content:center;">Add to Order</button>
      </div>
    </div>
  </div>

  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Order</h3>
      <button id="closeCart" aria-label="Close cart">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer" id="cartFooter"></div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="js/products.js"></script>
  <script src="js/script.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
