<!-- cart.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Order — MURI CHOPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
  <svg class="logo-icon" width="30" height="30" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="24" r="10" fill="#B85C38" />
    <circle cx="32" cy="15" r="13" fill="#B85C38" />
    <circle cx="44" cy="24" r="10" fill="#B85C38" />
    <rect x="16" y="22" width="32" height="14" rx="3" fill="#B85C38" />
    <rect x="14" y="36" width="36" height="20" rx="5" fill="#241C18" />
    <rect x="14" y="36" width="36" height="7" fill="#B85C38" />
  </svg>
  <span class="logo-text">Muri <em>Chops</em></span>
</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
      </nav>
      <button class="cart-btn" id="cartBtn" aria-label="Open cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
        </svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <section class="checkout-page">
    <h1 class="reveal-up in-view">Your Order</h1>

    <div class="checkout-layout">
      <!-- Order summary -->
      <div class="order-summary" id="orderSummary">
        <!-- populated by cart.js -->
      </div>

      <!-- Delivery details -->
      <div class="delivery-form">
        <h3>Delivery Details</h3>

        <div class="toggle-group" id="fulfillmentToggle">
          <button class="toggle-btn active" data-mode="delivery">Delivery</button>
          <button class="toggle-btn" data-mode="pickup">Pickup</button>
        </div>

        <div id="deliveryFields">
          <label class="field">
            <span>Name</span>
            <input type="text" id="custName" placeholder="Your full name">
          </label>
          <label class="field">
            <span>Phone number</span>
            <input type="tel" id="custPhone" placeholder="080XXXXXXXX">
          </label>
          <label class="field" id="addressField">
            <span>Address</span>
            <input type="text" id="custAddress" placeholder="Street, area, city">
          </label>
          <label class="field">
            <span>Delivery notes <em>(optional)</em></span>
            <input type="text" id="custNotes" placeholder="Gate code, landmark, etc.">
          </label>
        </div>

        <p class="form-error" id="formError"></p>

        <button class="btn btn-primary checkout-btn" id="whatsappCheckoutBtn" style="width:100%;justify-content:center;">
          Order via WhatsApp
        </button>
      </div>
    </div>
  </section>

  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Order</h3>
      <button id="closeCart" aria-label="Close cart">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer" id="cartFooter"></div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="js/products.js"></script>
  <script src="js/script.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
